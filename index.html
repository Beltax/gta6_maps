<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b29"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>VICE MAPS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"><link rel="stylesheet" href="style.css"><script defer src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script defer src="app.js"></script></head><body>
<div id="map" aria-label="Mapa interactivo"></div><div class="top"><header><div><span class="eyebrow">WORLD NAVIGATION / 01</span><h1>VICE<span> MAPS</span></h1></div><div class="clock"><b id="clock">--:--</b><small id="phase">AUTO</small></div></header><form id="search"><input id="query" type="search" placeholder="¿A dónde vamos?" aria-label="Buscar dirección o lugar" required><button type="submit" aria-label="Buscar">⌕</button></form><div id="results" hidden></div><nav id="themes" aria-label="Tema"><button data-theme="auto" class="active">AUTO</button><button data-theme="day">DÍA</button><button data-theme="dusk">ATARDECER</button><button data-theme="night">NOCHE</button></nav></div>
<div class="tools"><button id="gps" aria-label="Activar seguimiento GPS" title="GPS">➤<small>GPS</small></button><button id="pitch" title="Cambiar perspectiva">3D</button><button id="north" title="Orientar al norte">N</button><button id="plus" aria-label="Acercar">+</button><button id="minus" aria-label="Alejar">−</button></div><div class="bottom"><div id="status" role="status">Cargando mapa…</div><section id="destination" hidden><div class="dest-line"><div><span class="eyebrow">DESTINO</span><strong id="destname"></strong></div><button id="clear" aria-label="Quitar destino">×</button></div><div class="route-info" id="routeinfo" hidden><b id="distance"></b><span id="duration"></span></div><div class="route-actions"><button id="route">TRAZAR RUTA</button><button id="google">ABRIR EN MAPS ↗</button></div><div id="originhint"></div></section><div class="foot"><span><i></i> <span id="gpsstate">EXPLORACIÓN</span></span><a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Corregir mapa</a><span>V.01</span></div></div><noscript>Activá JavaScript para utilizar Vice Maps.</noscript></body></html>
